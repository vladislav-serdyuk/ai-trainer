services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai_trainer
      POSTGRES_PASSWORD: ai_trainer
      POSTGRES_DB: ai_trainer
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_trainer -d ai_trainer"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.21.0
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "-1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.21.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: "ollama pull ${LLM_MODEL}"
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Кэш моделей fastembed (embedding + реранкер) — на volume, чтобы
      # не скачивать их заново при пересоздании контейнера
      FASTEMBED_CACHE_PATH: /model_cache
      # Кэш HuggingFace (STT faster-whisper) — туда же на volume + увеличенный
      # таймаут, т.к. загрузка модели с HF из РФ часто флакит
      HF_HOME: /model_cache/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - ./src:/app/src:rw
      - ./knowledge_base:/app/knowledge_base:rw
      - model_cache:/model_cache
    restart: unless-stopped

volumes:
  db_data:
  model_cache:
  ollama_data:
