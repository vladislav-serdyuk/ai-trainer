[project]
name = "ai-trainer"
version = "0.1.0"
description = "AI-тренажёр для абитуриента и стажёра (Telegram-бот, RAG + LLM)"
authors = [
    { name = "Vladislav Serdyuk", email = "serdyuk2slava@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "aiogram>=3.15",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "av>=11,<19",
    "ddgs>=9.0",
    "fastembed>=0.4",
    "faster-whisper>=1.1",
    "openai>=1.60",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trainer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ASYNC",
    "RUF",
]
# Русскоязычные docstring/комментарии: кириллица и латиница визуально совпадают.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic-миграции генерируются автоматически.
"migrations/**" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["aiogram.*", "ddgs.*", "fastembed.*", "faster_whisper.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
